# 1. Define the separate storage buckets
media:
  - name: baseball_media
    input: images/baseball
    output: images/baseball
  - name: aviation_media
    input: images/aviation
    output: images/aviation
  - name: misc_media
    input: images/misc
    output: images/misc

content:
  # 2. Baseball Collection
  - name: Baseball Photos
    type: collection
    path: images/baseball
    extension: md
    format: yaml-frontmatter
    fields:
      - name: photo
        label: Upload Photo
        type: image
        media: baseball_media # <--- FORCES it to images/baseball
      - name: date
        label: Date Taken
        type: date
      - name: caption
        label: Caption
        type: string

  # 3. Aviation Collection
  - name: Aviation Photos
    type: collection
    path: images/aviation
    extension: md
    format: yaml-frontmatter
    fields:
      - name: photo
        label: Upload Photo
        type: image
        media: aviation_media # <--- FORCES it to images/aviation
      - name: date
        label: Date Taken
        type: date
      - name: caption
        label: Caption
        type: string

  # 4. Misc Collection
  - name: Misc Photos
    type: collection
    path: images/misc
    extension: md
    format: yaml-frontmatter
    fields:
      - name: photo
        label: Upload Photo
        type: image
        media: misc_media # <--- FORCES it to images/misc
      - name: date
        label: Date Taken
        type: date
      - name: caption
        label: Caption
        type: string