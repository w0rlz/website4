# 1. Media storage definitions
media:
  - name: baseball_media
    label: Baseball Photos
    input: images/baseball
    output: images/baseball
  - name: aviation_media
    label: Aviation Photos
    input: images/aviation
    output: images/aviation
  - name: misc_media
    label: Misc Photos
    input: images/misc
    output: images/misc

# 2. Collection definitions
content:
  - name: Baseball Photos
    type: collection
    path: images/baseball
    extension: md
    format: yaml-frontmatter
    fields:
      - name: photo
        label: Upload Photo
        type: image
        options:
          media: baseball_media  # Forces the upload to the baseball folder
          path: images/baseball  # Opens the file browser in this folder
      - name: date
        label: Date Taken
        type: date
      - name: caption
        label: Caption
        type: string

  - name: Aviation Photos
    type: collection
    path: images/aviation
    extension: md
    format: yaml-frontmatter
    fields:
      - name: photo
        label: Upload Photo
        type: image
        options:
          media: aviation_media  # Forces the upload to the aviation folder
          path: images/aviation  # Opens the file browser in this folder
      - name: date
        label: Date Taken
        type: date
      - name: caption
        label: Caption
        type: string

  - name: Misc Photos
    type: collection
    path: images/misc
    extension: md
    format: yaml-frontmatter
    fields:
      - name: photo
        label: Upload Photo
        type: image
        options:
          media: misc_media      # Forces the upload to the misc folder
          path: images/misc      # Opens the file browser in this folder
      - name: date
        label: Date Taken
        type: date
      - name: caption
        label: Caption
        type: string