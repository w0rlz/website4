<!DOCTYPE html>
<html>
<head>
    <title>Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>My Collection</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="baseball.html">Baseball</a>
            <a href="aviation.html">Aviation</a>
            <a href="misc.html">Misc</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>
    <div class="container">
        <div id="gallery" class="gallery">
            </div>
    </div>

<script>
    // 1. YOUR INFO
    const username = 'w0rlz'; 
    const repo = 'website4';
    const folder = 'baseball'; // Change this for aviation.html and misc.html

    async function loadImages() {
        const gallery = document.getElementById('gallery');
        
        try {
            // This URL is the "magic" way to list files without needing a login key
            const response = await fetch(`https://api.github.com/repos/${username}/${repo}/contents/images/${folder}`);
            const data = await response.json();
            
            if (!Array.isArray(data)) {
                console.error("Could not find the images folder.");
                return;
            }

            data.forEach(file => {
                // This checks if the file is an image
                if (file.name.match(/\.(jpg|jpeg|png|gif|webp)$/i)) {
                    const img = document.createElement('img');
                    
                    // We use the 'download_url' provided by GitHub
                    img.src = file.download_url;
                    img.alt = "Gallery Image";
                    
                    gallery.appendChild(img);
                }
            });
        } catch (error) {
            console.error("Error loading images:", error);
        }
    }

    loadImages();
</script>
</body>
</html>
