<!DOCTYPE html>
<html>
<head>
    <title>Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>My Collection</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="baseball.html">Baseball</a>
            <a href="aviation.html">Aviation</a>
            <a href="misc.html">Misc</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>
    <div class="container">
        <div id="gallery" class="gallery">
            </div>
    </div>

    <script>
        // CHANGE THIS NAME for each page: 'baseball', 'aviation', or 'misc'
        const folder = 'baseball'; 

        async function loadImages() {
            const response = await fetch(`https://api.github.com/repos/YOUR_USERNAME/YOUR_REPO_NAME/contents/images/${folder}`);
            const data = await response.json();
            const gallery = document.getElementById('gallery');
            
            data.forEach(file => {
                if(file.name.match(/\.(jpg|jpeg|png|gif)$/i)) {
                    const img = document.createElement('img');
                    img.src = file.download_url;
                    gallery.appendChild(img);
                }
            });
        }
        loadImages();
    </script>
</body>
</html>
