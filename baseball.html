<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE FEED | HAYDEN UNFRIED</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ticker-wrap">
        <div class="ticker">
            LATEST UPLOADS // ACTION VISUALS // 2026 // AVIATION // BASEBALL // MISC // LATEST UPLOADS // ACTION VISUALS // 2026 //
        </div>
    </div>

    <nav>
        <div style="font-family:'Archivo Black'; font-size: 1.8rem;">HAYDEN UNFRIED</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="photography.html" style="color: var(--accent-blue);">Photography</a>
            <a href="projects.html">Projects</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>

    <div class="hero" style="background: var(--light-grey); padding: 60px 20px;">
        <p class="badge" style="position: relative; top: 0; left: 0; display: inline-block; background: var(--accent-blue); color: white;">FLIGHT</p>
        <h1 style="font-size: 8vw;">AVIA<span>TION</span></h1>
    </div>
    <div id="aviation-gallery" class="gallery"></div>

    <div class="hero" style="border-top: 10px solid black; padding: 60px 20px;">
        <p class="badge" style="position: relative; top: 0; left: 0; display: inline-block;">DIAMOND</p>
        <h1 style="font-size: 8vw;">BASE<span>BALL</span></h1>
    </div>
    <div id="baseball-gallery" class="gallery"></div>

    <div class="hero" style="background: var(--text); color: white; border-top: 10px solid var(--accent-yellow); padding: 60px 20px;">
        <p class="badge" style="position: relative; top: 0; left: 0; display: inline-block; background: var(--white); color: black;">RANDOM</p>
        <h1 style="font-size: 8vw; -webkit-text-stroke: 2px white;">MI<span>SC</span></h1>
    </div>
    <div id="misc-gallery" class="gallery" style="background: var(--light-grey);"></div>

    <script>
        const username = 'w0rlz'; 
        const repo = 'website4';

        // Function to load a specific folder into a specific ID
        async function loadFolder(folderName, containerId) {
            const container = document.getElementById(containerId);
            try {
                // Adjusting your fetch to point to images/[folder]
                const response = await fetch(`https://api.github.com/repos/${username}/${repo}/contents/images/${folderName}`);
                const files = await response.json();
                
                const images = files.filter(f => f.name.match(/\.(jpg|jpeg|png|webp|JPG)$/i));
                const dataFiles = files.filter(f => f.name.endsWith('.md'));

                for (const imgFile of images) {
                    const baseName = imgFile.name.split('.')[0];
                    const match = dataFiles.find(d => d.name.includes(baseName));
                    let date = "SEASON 2026", caption = "Action Shot";

                    if (match) {
                        const infoResp = await fetch(match.download_url);
                        const text = await infoResp.text();
                        date = text.match(/date: (.*)/)?.[1]?.replace(/"/g, '') || date;
                        caption = text.match(/caption: (.*)/)?.[1]?.replace(/"/g, '') || caption;
                    }

                    const card = document.createElement('div');
                    card.className = 'photo-card';
                    card.innerHTML = `
                        <div class="badge" style="background:${folderName === 'aviation' ? 'var(--accent-blue)' : 'var(--accent-yellow)'}; color:${folderName === 'aviation' ? 'white' : 'black'}">${folderName.toUpperCase()}</div>
                        <img src="${imgFile.download_url}" alt="${folderName} action">
                        <div class="photo-info">
                            <strong>${date}</strong>
                            <p>${caption}</p>
                        </div>`;
                    container.appendChild(card);
                }
            } catch (e) { console.log(`Syncing ${folderName} gallery...`); }
        }

        // Run the loader for all three sections
        loadFolder('aviation', 'aviation-gallery');
        loadFolder('baseball', 'baseball-gallery');
        loadFolder('misc', 'misc-gallery');
    </script>

    <footer>
        <p>HAYDEN UNFRIED // 2026 // ALL SYSTEMS GO</p>
    </footer>
</body>
</html>
