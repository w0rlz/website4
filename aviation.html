<!DOCTYPE html>
<html>
<head>
    <title>Aviation Photography</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Aviation Gallery</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="baseball.html">Baseball</a>
            <a href="aviation.html">Aviation</a>
            <a href="misc.html">Misc</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>
    <div class="container">
        <div id="aviation-gallery" class="gallery">
            </div>
    </div>

    <script>
        async function loadAviation() {
            // Update the URL below with your GitHub info
            const repo = 'YOUR_USERNAME/YOUR_REPO_NAME';
            const response = await fetch(`https://api.github.com/repos/${repo}/contents/images/aviation`);
            const data = await response.json();
            const gallery = document.getElementById('aviation-gallery');
            
            data.forEach(file => {
                if(file.name.match(/\.(jpg|jpeg|png|webp)$/i)) {
                    const img = document.createElement('img');
                    img.src = file.download_url;
                    gallery.appendChild(img);
                }
            });
        }
        loadAviation();
    </script>
</body>
</html>
