<!DOCTYPE html>
<html>
<head>
    <title>My Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Photography</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="baseball.html">Baseball</a>
            <a href="aviation.html">Aviation</a>
            <a href="misc.html">Misc</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>
    <div class="container">
        <div id="gallery" class="gallery"></div>
    </div>

    <script>
        const username = 'w0rlz'; 
        const repo = 'website4';
        const folder = 'aviation'; // Change to 'aviation' or 'misc' for those pages

        async function loadGallery() {
            const gallery = document.getElementById('gallery');
            try {
                const response = await fetch(`https://api.github.com/repos/${username}/${repo}/contents/images/${folder}`);
                const files = await response.json();

                const images = files.filter(f => f.name.match(/\.(jpg|jpeg|png|webp)$/i));
                const dataFiles = files.filter(f => f.name.endsWith('.md'));

                for (const imgFile of images) {
                    const card = document.createElement('div');
                    card.className = 'photo-card';

                    const img = document.createElement('img');
                    img.src = imgFile.download_url;
                    card.appendChild(img);

                    const baseName = imgFile.name.split('.')[0];
                    const match = dataFiles.find(d => d.name.includes(baseName));

                    if (match) {
                        const infoResp = await fetch(match.download_url);
                        const text = await infoResp.text();
                        const date = text.match(/date: (.*)/)?.[1]?.replace(/"/g, '') || "";
                        const caption = text.match(/caption: (.*)/)?.[1]?.replace(/"/g, '') || "";

                        const info = document.createElement('div');
                        info.className = 'photo-info';
                        info.innerHTML = `<strong>${date}</strong><p>${caption}</p>`;
                        card.appendChild(info);
                    }
                    gallery.appendChild(card);
                }
            } catch (e) { console.log("Waiting for uploads..."); }
        }
        loadGallery();
    </script>
</body>
</html>
