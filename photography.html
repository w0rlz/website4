<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE FEED | HAYDEN UNFRIED</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div style="font-family:'Archivo Black'; font-size: 1.8rem;">HAYDEN UNFRIED</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="photography.html" style="color: var(--accent-blue);">Photography</a>
            <a href="projects.html">Projects</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>

    <div class="hero">
        <p class="badge" style="position: relative; display: inline-block; background: var(--accent-blue); color: white;">FLIGHT</p>
        <h1>AVIA<span>TION</span></h1>
    </div>
    <div id="aviation-gallery" class="gallery"></div>

    <div class="hero" style="border-top: 10px solid black;">
        <p class="badge" style="position: relative; display: inline-block;">DIAMOND</p>
        <h1>BASE<span>BALL</span></h1>
    </div>
    <div id="baseball-gallery" class="gallery"></div>

    <div class="hero dark">
        <p class="badge" style="position: relative; display: inline-block; background: var(--white); color: black;">RANDOM</p>
        <h1>MI<span>SC</span></h1>
    </div>
    <div id="misc-gallery" class="gallery" style="background: var(--light-grey); border-bottom: 10px solid black;"></div>

    <script>
        const username = 'w0rlz'; 
        const repo = 'website4';

        async function loadFolder(folderName, containerId) {
            const container = document.getElementById(containerId);
            try {
                const response = await fetch(`https://api.github.com/repos/${username}/${repo}/contents/images/${folderName}`);
                const files = await response.json();
                const images = files.filter(f => f.name.match(/\.(jpg|jpeg|png|webp|JPG)$/i));
                const dataFiles = files.filter(f => f.name.endsWith('.md'));

                for (const imgFile of images) {
                    const baseName = imgFile.name.split('.')[0];
                    const match = dataFiles.find(d => d.name.includes(baseName));
                    let date = "2026", caption = "Action Visuals";

                    if (match) {
                        const infoResp = await fetch(match.download_url);
                        const text = await infoResp.text();
                        date = text.match(/date: (.*)/)?.[1]?.replace(/"/g, '') || date;
                        caption = text.match(/caption: (.*)/)?.[1]?.replace(/"/g, '') || caption;
                    }

                    const card = document.createElement('div');
                    card.className = 'photo-card';
                    card.innerHTML = `
                        <div class="badge" style="background:${folderName === 'aviation' ? 'var(--accent-blue)' : 'var(--accent-yellow)'}; color:${folderName === 'aviation' ? 'white' : 'black'}">${folderName.toUpperCase()}</div>
                        <img src="${imgFile.download_url}">
                        <div class="photo-info"><strong>${date}</strong><p>${caption}</p></div>`;
                    container.appendChild(card);
                }
            } catch (e) { console.log(`Syncing ${folderName}...`); }
        }

        loadFolder('aviation', 'aviation-gallery');
        loadFolder('baseball', 'baseball-gallery');
        loadFolder('misc', 'misc-gallery');
    </script>

    <footer>
        <h2 style="font-family:'Archivo Black'; color:var(--accent-yellow); font-size: 3rem;">WANT THE FULL FILE?</h2>
        <p style="font-size: 1.5rem; margin-bottom: 20px;">Email: <a href="mailto:contact@haydenunfried.com" style="color: var(--accent-blue);">contact@haydenunfried.com</a></p>
    </footer>
</body>
</html>
